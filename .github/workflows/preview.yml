name: Design Preview
on: workflow_dispatch
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/preview_designs.py
      - name: Save previews to the design-preview branch
        run: |
          cd preview
          git init -q -b design-preview
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add . && git commit -qm "design previews"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" design-preview
