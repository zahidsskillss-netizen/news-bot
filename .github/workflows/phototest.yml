name: phototest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import photos
          sg={"title":"د قوش‌تېپې کانال ته د اوبو خوشې کېدو ته چمتووالی","summary":"د ملي پراختیا شرکت چارواکي وایي چې د قوش‌تېپې لوی کانال د دویم فاز د کېندنې چارې وروستیو پړاوونو ته رسېدلې دي."}
          kw=photos.keywords(sg); print("KW",kw)
          for q in kw: print(q, photos.commons(q))
          ims=photos.gather(sg); print("GOT",[i.size for i in ims])
          PY
