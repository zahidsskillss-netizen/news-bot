name: News Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقې
  workflow_dispatch:         # په لاس چلول (Run workflow تڼۍ)
  push:
    branches: [main]
    paths-ignore: ["posted.json"]

permissions:
  contents: write
  models: read

concurrency: news-bot

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          CHANNEL_SIGNATURE: ${{ secrets.CHANNEL_SIGNATURE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PER_RUN: "5"
        run: python bot.py

      - name: Save posted list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "posted news update" && git push)
