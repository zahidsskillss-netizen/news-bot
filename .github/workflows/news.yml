name: News Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقې
  workflow_dispatch:         # په لاس چلول (Run workflow تڼۍ)
  push:
    branches: [main]
    paths-ignore: ["posted.json"]

permissions:
  contents: write
  actions: write
  models: read

concurrency: news-bot

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          CHANNEL_SIGNATURE: ${{ secrets.CHANNEL_SIGNATURE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PER_RUN: "5"
        run: python bot.py

      - name: Video bulletin (Telegram voices)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python video_bulletin.py tick

      - name: Save posted list
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for f in posted.json bulletin.json fb_page.enc fb_secret.enc yt_token.enc; do [ -f "$f" ] && git add "$f" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "posted news update"
          # که په همدې وخت کې بل بدلون پورته شوی وي، لومړی یې راښکته او بیا پورته کوو
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 3))
          done
          exit 1

      # GitHub خپل مهالوېش (cron) په باوري ډول نه چلوي، نو هر ځل پای کې راتلونکی ځل پخپله پیلوو.
      # concurrency له امله تل یوازې یو روان او یو انتظار کې وي، نو تکرار نه زیاتیږي.
      - name: Schedule next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 210
          for i in 1 2 3 4 5 6; do
            timeout 60 gh workflow run news.yml --ref main -R "${{ github.repository }}" && exit 0
            echo "retry $i"; sleep 20
          done
          exit 1
