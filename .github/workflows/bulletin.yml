name: Video Bulletin

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: video-bulletin

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
              && mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
              && sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/ \
              || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
          fi
          ffmpeg -version | head -1
          pip install -r requirements.txt -r requirements-video.txt

      - name: Render and upload
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python video_bulletin.py render

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          for f in bulletin_done.json; do [ -f "$f" ] && git add "$f" || true; done
          git diff --cached --quiet && exit 0
          git commit -m "video bulletin update"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 3))
          done
